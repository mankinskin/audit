[package]
name = "audit-cli"
version = "0.1.0"
edition = "2024"
description = "CLI interface for audit-api: the `audit` command"

[[bin]]
name = "audit"
path = "src/bin/audit.rs"

[lib]
name = "audit_cli"
path = "src/lib.rs"

[dependencies]
audit-api = { path = "../audit-api" }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main"  }
session-api = { git = "https://github.com/mankinskin/session", branch = "main" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toon-format = "0.5"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }